name: Thunder Engine CI

on:
  push:
  pull_request:

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev libxxhash-dev
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DTHUNDER_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Run Test Suites (28 Test Suites Merge Gate)
        run: ctest --test-dir build-ci --output-on-failure

  vulkan:
    # Presentation-layer merge gate: ~37% of the codebase previously had no CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libzstd-dev libxxhash-dev libvulkan-dev glslc libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxxf86vm-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev && glslc --version
      - name: Configure (Vulkan backend + tests)
        run: cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release -DTHUNDER_BUILD_VULKAN=ON -DTHUNDER_WARNINGS_AS_ERRORS=OFF -DSDL_X11_XTEST=OFF
      - name: Build
        run: cmake --build build-vulkan --parallel 2
      - name: Run Test Suites
        run: ctest --test-dir build-vulkan --output-on-failure
